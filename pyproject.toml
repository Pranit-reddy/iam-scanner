[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iam-scanner"
version = "0.1.0"
description = "AWS IAM misconfiguration scanner mapped to CIS AWS Foundations Benchmark v3.0.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "moto[iam,s3,ec2,sts]>=5",
    "ruff>=0.5",
]

[project.scripts]
iam-scanner = "iam_scanner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
